<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bug Bounty Admin</title>
<style>
:root{--bg:#F4FBF7;--surface:#fff;--primary:#0B3D2E;--mint:#1CC88A;--text:#17241E;--muted:#5C7268;--border:#DCEBE3;--danger:#D64545;--ok:#E6F9EF;--warn:#FFF6DD}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:14px;max-width:720px;margin:auto}
h2{margin:6px 0 10px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--primary);color:#fff;cursor:pointer;margin:3px 3px 3px 0}
button.g{background:#fff;color:var(--primary);border:1px solid var(--border)}button.r{background:var(--danger)}button.m{background:var(--mint);color:#06281d}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:10px;width:90px}
.tabs button{background:#fff;color:var(--primary);border:1px solid var(--border)}.tabs button.on{background:var(--primary);color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;background:var(--ok)}.tag.w{background:var(--warn)}.tag.d{background:#FDEAEA}
.hint{background:var(--warn);border-radius:8px;padding:6px 8px;font-size:.88rem;margin:6px 0;white-space:pre-wrap}.mut{color:var(--muted);font-size:.88rem}
pre{white-space:pre-wrap;margin:6px 0;font:inherit;background:var(--ok);border-radius:8px;padding:6px 8px}[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);max-width:92%;padding:11px 18px;border-radius:14px;background:var(--primary);color:#fff;opacity:0;pointer-events:none;transition:.25s;z-index:99;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--danger)}
#modal{position:fixed;inset:0;background:rgba(10,30,22,.5);display:grid;place-items:center;z-index:98;padding:20px}
#modal .box{background:#fff;border-radius:18px;padding:18px;max-width:380px;width:100%}#modal h3{margin:0 0 6px}
button.busy{opacity:.55;pointer-events:none}.banner{background:#FDEAEA;border:1px solid #F3C4C4;border-radius:12px;padding:10px 12px;margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{background:#fff;color:var(--primary);border:1px solid var(--border);border-radius:99px;padding:6px 11px;margin:0;font-size:.88rem}.chips button.on{background:var(--primary);color:#fff}
input.s{width:100%;margin:2px 0 6px}.pay b.big{font-size:1.15rem}.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--mint)}.bar.over i{background:var(--danger)}
#toast.act{pointer-events:auto}#toast .u{background:#fff;color:var(--primary);margin:0 0 0 10px;padding:5px 10px}
</style>
</head>
<body>
<div id="toast"></div><div id="modal" hidden></div>
<div id="login" class="card">
  <h2>🐞 Bug Bounty Admin</h2>
  <button id="gbtn">Google se login</button>
  <p id="lmsg" class="mut"></p>
</div>

<div id="app" hidden>
  <div class="card"><b>Admin</b> <span id="who" class="mut"></span> <button class="g" id="out">Logout</button>
    <div id="sum" class="mut"></div></div>
  <div id="banner"></div>
  <div class="tabs"><button id="tH" class="on">👥 Hunters</button><button id="tR">📋 Reports</button><button id="tP">💸 Payments</button><button id="tE">📤 Export</button></div>
  <div id="pH"></div>
  <div id="pR" hidden><div id="rBar"></div><div id="rList"></div></div>
  <div id="pP" hidden></div>
  <div id="pE" hidden>
    <div class="card"><button id="eTxt">📋 Reports ko text mein copy karo</button><button id="eJson" class="g">⬇️ JSON download</button><p id="eMsg" class="mut"></p></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, get, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const ADMIN_EMAIL = 'hellochaman532@gmail.com'; // real protection = Firebase Rules; this only shapes the UI
const app = initializeApp({
  apiKey: "AIzaSyB99IukU3A9SHpmYiO2QJ7anYuoohwlwnc", authDomain: "quran-quiz-85.firebaseapp.com",
  databaseURL: "https://quran-quiz-85-default-rtdb.firebaseio.com/", projectId: "quran-quiz-85",
  appId: "1:1074137604510:web:cc7caceb53b9045fc9f68f"
}, 'admin');
const db = getDatabase(app), auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => t ? new Date(t).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '-';

function toast(msg, err, undo) {
  const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.toggle('act', !!undo);
  if (undo) { const u = document.createElement('button'); u.className = 'u'; u.textContent = '↩️ Undo';
    u.onclick = async () => { t.classList.remove('show'); try { await undo(); render(); toast('Undo ho gaya'); } catch (e) { toast('Undo nahi hua: ' + errMsg(e), true); } };
    t.appendChild(u); }
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), undo ? 7000 : err ? 4200 : 2400);
}
function ask(title, msg, ok = 'Haan') {
  return new Promise(res => {
    const m = $('modal'); m.hidden = false;
    m.innerHTML = `<div class="box"><h3>${esc(title)}</h3><p class="mut">${esc(msg)}</p><button class="g" id="mNo">Nahi</button><button class="r" id="mYes">${esc(ok)}</button></div>`;
    const done = v => { m.hidden = true; m.innerHTML = ''; res(v); };
    $('mYes').onclick = () => done(true); $('mNo').onclick = () => done(false); m.onclick = e => { if (e.target === m) done(false); };
  });
}
const errMsg = e => /PERMISSION_DENIED/i.test(e.code || e.message || '')
  ? 'Permission nahi mili. Firebase rules publish hue? (firebase-rules.json wala version chahiye)' : (e.code || e.message);

let hunters = {}, status = {}, reports = {}, verdicts = {}, settings = {}, quran = null, tab = 'H', rf = 'pending', rq = '';
const TABS = ['H', 'R', 'P', 'E'];

/* same normalization as the app's search, used only for the auto-hints */
const norm = t => String(t).replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
  .replace(/[\u0622\u0623\u0625\u0671]/g, '\u0627').replace(/[\u0649\u06CC\u06D2]/g, '\u064A')
  .replace(/\u06A9/g, '\u0643').replace(/[\u06C1\u06BE]/g, '\u0647').replace(/\u06C3/g, '\u0629').replace(/\u06BA/g, '\u0646');

/* ---------- login ---------- */
$('gbtn').onclick = async () => {
  $('lmsg').textContent = '';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $('lmsg').textContent = 'Login nahi hua: ' + (e.code || e.message); }
};
$('out').onclick = () => signOut(auth);
onAuthStateChanged(auth, async u => {
  const ok = u && !u.isAnonymous && u.email === ADMIN_EMAIL && u.emailVerified;
  if (u && !ok) { $('lmsg').textContent = 'Ye account admin nahi hai.'; await signOut(auth); return; }
  $('login').hidden = !!ok; $('app').hidden = !ok;
  if (ok) { $('who').textContent = u.email; load(); }
});

/* ---------- data ---------- */
async function load() {
  const g = async p => (await get(ref(db, 'bounty/' + p))).val() || {};
  try {
    [hunters, status, reports, verdicts, settings] = await Promise.all([g('hunters'), g('status'), g('reports'), g('admin/verdicts'), g('admin/settings')]);
  } catch (e) { $('pH').innerHTML = '<div class="card">Data nahi mila (rules ya login check karein): ' + esc(e.code || e.message) + '</div>'; return; }
  try { await set(ref(db, 'bounty/admin/lastLogin'), serverTimestamp()); $('banner').innerHTML = ''; }
  catch (e) { $('banner').innerHTML = '<div class="banner">⚠️ Firebase rules purane hain: approve/verdict save nahi honge. <b>firebase-rules.json</b> ka naya version Rules tab mein publish karein.</div>'; }
  if (!quran) { try { quran = await (await fetch('quran_full.json')).json(); } catch { quran = null; } }
  render();
}
const byUid = () => Object.fromEntries(Object.values(hunters).map(h => [h.uid, h]));
const repList = () => Object.entries(reports).map(([id, r]) => ({ id, ...r })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

const rid = id => 'QB-' + id.slice(-6).toUpperCase();
const stOf = r => (verdicts[r.id] || {}).status || 'pending';
const mKey = t => { const d = new Date(t || Date.now()); return d.getFullYear() + '-' + d.getMonth(); };
function monthStats(skipId) {
  const k = mKey(), o = { n: 0, valid: 0, paid: 0 };
  repList().forEach(r => { const v = verdicts[r.id]; if (v && v.status === 'valid' && r.id !== skipId && mKey(r.createdAt) === k) { o.n++; o.valid += v.amount || 0; if (v.paid) o.paid += v.amount || 0; } });
  return o;
}
async function writeVerdict(id, v) {
  const val = v ? { status: v.status, amount: v.amount || 0, paid: !!v.paid, updatedAt: serverTimestamp() } : null, r = reports[id];
  const up = { ['admin/verdicts/' + id]: val }; if (r) up['pub/' + r.hunterId + '/' + id] = val; // user sees this in "Meri reports"
  await update(ref(db, 'bounty'), up);
  if (v) verdicts[id] = { status: v.status, amount: v.amount || 0, paid: !!v.paid, updatedAt: Date.now() }; else delete verdicts[id];
}
async function setPaid(ids, val) {
  const up = {};
  ids.forEach(i => { const r = reports[i]; up['admin/verdicts/' + i + '/paid'] = val; up['admin/verdicts/' + i + '/updatedAt'] = serverTimestamp();
    if (r) { up['pub/' + r.hunterId + '/' + i + '/paid'] = val; up['pub/' + r.hunterId + '/' + i + '/updatedAt'] = serverTimestamp(); } });
  await update(ref(db, 'bounty'), up); ids.forEach(i => { if (verdicts[i]) verdicts[i].paid = val; });
}

function hint(r) {
  if (!quran) return '';
  const c = r.claim || {}, s = r.snapshot || {}, out = [];
  if (r.type === 'search') {
    const row = quran.find(a => a.surah_number === c.surah && a.ayat_no === c.ayat);
    if (!row) return 'Auto: claimed surah:ayat data mein nahi mili.';
    const q = s.query || '';
    if (/[a-z]/i.test(q)) out.push('Latin query (surah naam): search mein khud check karein.');
    else if (norm(row.text).includes(norm(q).trim())) out.push('✅ Query is ayat ke text mein hai, search mein aani chahiye thi (valid ho sakta hai).');
    else out.push('❌ Query is ayat ke text mein nahi hai (Uthmani spelling ka masla ya galat query, reject ho sakta hai).');
    out.push(row.para === c.para && row.pip === c.pip ? 'Para/pip data se match.' : `⚠️ Data mein para ${row.para}, pip ${row.pip}; claim ${c.para}/${c.pip}: mushaf se verify karein.`);
  } else {
    const a = s.ayat || {};
    out.push(a.para === c.para && a.pip === c.pip ? '❌ App ka data claim ke barabar hai (app sahi tha, reject ho sakta hai).' : `⚠️ App ke data mein para ${a.para}, pip ${a.pip}; claim ${c.para}/${c.pip}: apne mushaf se verify karein.`);
  }
  return 'Auto: ' + out.join('\n');
}

/* ---------- render ---------- */
function render() {
  const rs = repList(), owner = byUid();
  const unpaid = rs.reduce((n, r) => { const v = verdicts[r.id]; return n + (v && v.status === 'valid' && !v.paid ? (v.amount || 0) : 0); }, 0);
  const pend = Object.values(hunters).filter(h => !status[h.uid]).length;
  const ms = monthStats(), cap = +settings.monthCap || 0;
  $('sum').textContent = `Hunters: ${Object.keys(hunters).length} (pending ${pend}) | Reports: ${rs.length} | Baaki payment: ₹${unpaid} | Is mahine valid: ₹${ms.valid}${cap ? ' / ₹' + cap + (ms.valid >= cap ? ' ⚠️' : '') : ''}`;

  const hst = {}; rs.forEach(r => { const o = hst[r.hunterId] ||= { n: 0, a: 0 }; o.n++; const v = verdicts[r.id]; if (v && v.status === 'valid') o.a += v.amount || 0; });
  const rej = {}; rs.forEach(r => { if ((verdicts[r.id] || {}).status === 'rejected') rej[r.hunterId] = (rej[r.hunterId] || 0) + 1; });
  const hs = Object.entries(hunters).map(([wa, h]) => ({ wa, ...h })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  $('pH').innerHTML = hs.length ? hs.map(h => {
    const st = (h.uid && status[h.uid]) || 'pending', n = rej[h.uid] || 0;
    return `<div class="card"><b>${esc(h.name)}</b> <span class="tag ${st === 'approved' ? '' : st === 'blocked' ? 'd' : 'w'}">${st}</span>
      <div class="mut">WhatsApp: ${esc(h.whatsapp)} | UPI: ${esc(h.upi)}<br>Reports ${(hst[h.uid] || { n: 0 }).n} | Valid ₹${(hst[h.uid] || { a: 0 }).a}<br>Exam: ${esc(h.examScore)} | ${fmt(h.createdAt)}${n >= 3 ? ` | ⚠️ ${n} reject` : ''}</div>
      ${!h.uid ? '<div class="hint">Purana record (login id nahi hai). Approve nahi ho sakta: Reset karein, hunter dobara apply karega.</div>' : ''}
      ${h.uid && st !== 'approved' ? `<button class="m" data-a="approve" data-u="${esc(h.uid)}">✅ Approve</button>` : ''}
      ${h.uid && st !== 'blocked' ? `<button class="r" data-a="block" data-u="${esc(h.uid)}">⛔ Block</button>` : ''}
      <button class="g" data-a="hrep" data-w="${esc(h.wa)}">📋 Reports</button>
      <button class="g" data-a="reset" data-u="${esc(h.uid)}" data-w="${esc(h.wa)}">🔄 Reset (dobara apply)</button></div>`;
  }).join('') : '<div class="card mut">Abhi koi hunter nahi.</div>';

  renderBar(); renderList(); renderPay();
  TABS.forEach(k => { $('t' + k).classList.toggle('on', tab === k); $('p' + k).hidden = tab !== k; });
}
const FILTERS = [['pending', '⏳ Pending'], ['valid', '✅ Valid'], ['duplicate', '🔁 Duplicate'], ['rejected', '❌ Reject'], ['all', 'Sab']];
function renderBar() {
  const rs = repList(), cnt = f => f === 'all' ? rs.length : rs.filter(r => stOf(r) === f).length;
  $('rBar').innerHTML = `<div class="chips">${FILTERS.map(([f, t]) => `<button data-f="${f}" class="${rf === f ? 'on' : ''}">${t} ${cnt(f)}</button>`).join('')}</div>
    <input class="s" id="rQ" placeholder="Search: naam, WhatsApp, UPI, QB-ID, query" value="${esc(rq)}">`;
  $('rQ').oninput = e => { rq = e.target.value; renderList(); };
}
function renderList() {
  const rs = repList(), owner = byUid(), q = rq.trim().toLowerCase();
  const shown = rs.filter(r => (rf === 'all' || stOf(r) === rf) && (!q || [rid(r.id), (owner[r.hunterId] || {}).name, (owner[r.hunterId] || {}).whatsapp, (owner[r.hunterId] || {}).upi, (r.snapshot || {}).query].join(' ').toLowerCase().includes(q))).reverse();
  $('rList').innerHTML = shown.length ? shown.map(r => {
    const v = verdicts[r.id] || {}, h = owner[r.hunterId] || {}, fp = r.fingerprint;
    const first = rs.find(x => x.fingerprint === fp), dup = first && first.id !== r.id;
    const c = r.claim || {}, s = r.snapshot || {};
    const body = r.type === 'search' ? `Search: <b>${esc(s.query)}</b> (${esc(s.filter)}), ${esc(s.count)} result<br>Claim: ${esc(c.surah)}:${esc(c.ayat)}, para ${esc(c.para)}, pip ${esc(c.pip)}`
      : `Ayat ${esc((s.ayat || {}).s)}:${esc((s.ayat || {}).a)} (app: para ${esc((s.ayat || {}).para)}, pip ${esc((s.ayat || {}).pip)})<br>User ne likha: ${esc(JSON.stringify(s.typed || {}))} | App: ${esc(s.appResult)}<br>Claim: para ${esc(c.para)}, pip ${esc(c.pip)}`;
    return `<div class="card"><b>${rid(r.id)}</b> <span class="tag">${esc(r.type)}</span>
      <span class="tag ${v.status === 'valid' ? '' : v.status ? 'd' : 'w'}">${esc(v.status || 'pending')}</span>${v.paid ? ' <span class="tag">paid ✅</span>' : ''}${dup ? ' <span class="tag d">duplicate?</span>' : ''}
      <div class="mut">${esc(h.name || '?')} | ${esc(h.whatsapp || '')} | ${esc(h.upi || '')} | ${fmt(r.createdAt)}</div>
      <div>${body}</div>${r.opinion ? `<div class="mut">Raay: ${esc(r.opinion)}</div>` : ''}
      <div class="hint">${esc(hint(r))}${dup ? `\nPehli report is fingerprint ki: ${rid(first.id)}` : ''}</div>
      ₹<input type="number" min="0" max="100" id="am_${esc(r.id)}" value="${v.amount ?? ''}" placeholder="0-100">
      <button class="m" data-a="valid" data-r="${esc(r.id)}">Valid</button><button class="g" data-a="duplicate" data-r="${esc(r.id)}">Duplicate</button><button class="r" data-a="rejected" data-r="${esc(r.id)}">Reject</button>
      ${v.status === 'valid' ? `<button class="g" data-a="paid" data-r="${esc(r.id)}">${v.paid ? 'Paid hata do' : '💸 Paid mark'}</button>` : ''}${v.status ? `<button class="g" data-a="undo" data-r="${esc(r.id)}">↩️ Undo faisla</button>` : ''}</div>`;
  }).join('') : '<div class="card mut">Is filter mein koi report nahi.</div>';
}
function renderPay() {
  const owner = byUid(), g = {}, ms = monthStats(), cap = +settings.monthCap || 0;
  repList().forEach(r => { const v = verdicts[r.id]; if (!v || v.status !== 'valid') return;
    const o = g[r.hunterId] ||= { h: owner[r.hunterId] || {}, due: 0, paid: 0, n: 0 };
    if (v.paid) o.paid += v.amount || 0; else { o.due += v.amount || 0; o.n++; } });
  const rows = Object.entries(g).sort((a, b) => b[1].due - a[1].due), total = rows.reduce((n, [, o]) => n + o.due, 0);
  const pct = cap ? Math.min(100, Math.round(ms.valid / cap * 100)) : 0;
  $('pP').innerHTML = `<div class="card"><b>Is mahine</b> <span class="mut">(report ki date ke hisaab se)</span><br>${ms.n} valid | ₹${ms.valid} (paid ₹${ms.paid}, baaki ₹${ms.valid - ms.paid})
      ${cap ? `<div class="bar ${ms.valid > cap ? 'over' : ''}"><i style="width:${pct}%"></i></div><div class="mut">Cap ₹${cap}: ${ms.valid > cap ? 'paar ho gaya ⚠️' : '₹' + (cap - ms.valid) + ' bacha'}</div>` : '<div class="mut">Cap set nahi hai.</div>'}
      <div>Mahine ka cap ₹ <input type="number" min="0" id="capIn" value="${cap || ''}" placeholder="0 = koi nahi"> <button data-a="cap">Save</button></div></div>
    <div class="card"><b>Total baaki: ₹${total}</b> <span class="mut">(${rows.filter(([, o]) => o.due).length} hunters)</span></div>` +
    (rows.length ? rows.map(([uid, o]) => `<div class="card pay"><b>${esc(o.h.name || '(hunter reset)')}</b> <span class="mut">${esc(o.h.whatsapp || '')}</span>
      <div>UPI: <b>${esc(o.h.upi || '-')}</b></div>
      <div>Baaki <b class="big">₹${o.due}</b> (${o.n} report) <span class="mut">| Mila ₹${o.paid}</span></div>
      ${o.h.upi ? `<button class="g" data-cp="${esc(o.h.upi)}">📋 UPI copy</button>` : ''}${o.due ? `<button class="g" data-cp="${o.due}">📋 ₹${o.due} copy</button><button class="m" data-a="payall" data-u="${esc(uid)}">💸 Sab paid mark</button>` : '<span class="tag">sab paid ✅</span>'}</div>`).join('')
      : '<div class="card mut">Abhi koi valid report nahi.</div>');
}
TABS.forEach(k => $('t' + k).onclick = () => { tab = k; render(); });

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a, u = b.dataset.u, id = b.dataset.r, hn = (byUid()[u] || hunters[b.dataset.w] || {}).name || 'Hunter';
  const label = b.textContent; 
  try {
    if (a === 'hrep') { tab = 'R'; rf = 'all'; rq = b.dataset.w; render(); scrollTo(0, 0); return; }
    if (a === 'cap') { const n = Math.max(0, Math.round(+$('capIn').value || 0)); b.classList.add('busy'); await set(ref(db, 'bounty/admin/settings/monthCap'), n); settings.monthCap = n; toast(n ? 'Cap ₹' + n + ' save ho gaya' : 'Cap hata diya'); render(); return; }
    if (a === 'undo') {
      if (!await ask('Faisla wapas lein?', rid(id) + ' phir se pending ho jayegi aur hunter ko "Review mein" dikhegi.', 'Undo')) return;
      b.classList.add('busy'); await writeVerdict(id, null); toast('↩️ ' + rid(id) + ' pending ho gayi'); render(); return;
    }
    if (a === 'payall') {
      const ids = repList().filter(r => r.hunterId === u && (verdicts[r.id] || {}).status === 'valid' && !verdicts[r.id].paid).map(r => r.id), sum = ids.reduce((n, i) => n + verdicts[i].amount, 0);
      if (!ids.length || !await ask('Sab paid mark karein?', ids.length + ' reports, total ₹' + sum + '. Pehle UPI se payment kar dein.', 'Paid mark')) return;
      b.classList.add('busy'); await setPaid(ids, true); toast('💸 ₹' + sum + ' paid mark ho gaya', false, () => setPaid(ids, false)); render(); return;
    }
    if (a === 'block' && !await ask('Block karein?', hn + ' ab report nahi bhej payega.', 'Block')) return;
    if (a === 'reset' && !await ask('Reset karein?', hn + ' ko dobara apply karna hoga. Purani reports safe rahengi.', 'Reset')) return;
    let amount = 0; const prevSt = status[u], prevV = verdicts[id] ? { ...verdicts[id] } : null;
    const undoSt = async () => { await set(ref(db, 'bounty/status/' + u), prevSt || null); if (prevSt) status[u] = prevSt; else delete status[u]; };
    if (a === 'valid') {
      amount = Math.round(+$('am_' + id).value || 0); if (!(amount > 0 && amount <= 100)) { toast('Valid ke liye amount 1 se 100 likhein', true); return; }
      const cap = +settings.monthCap || 0, ms = monthStats(id);
      if (cap && ms.valid + amount > cap && !await ask('Mahine ka cap paar hoga', 'Is mahine ₹' + ms.valid + ' valid ho chuka hai, cap ₹' + cap + '. Phir bhi ₹' + amount + ' valid karein?', 'Haan, valid')) return;
    }
    b.classList.add('busy'); b.textContent = '…';
    if (a === 'approve') { await set(ref(db, 'bounty/status/' + u), 'approved'); status[u] = 'approved'; toast('✅ ' + hn + ' approve ho gaya', false, undoSt); }
    else if (a === 'block') { await set(ref(db, 'bounty/status/' + u), 'blocked'); status[u] = 'blocked'; toast('⛔ ' + hn + ' block ho gaya', false, undoSt); }
    else if (a === 'reset') {
      const up = { ['hunters/' + b.dataset.w]: null }; if (u) { up['byUid/' + u] = null; up['status/' + u] = null; }
      await update(ref(db, 'bounty'), up); delete hunters[b.dataset.w]; if (u) delete status[u]; toast('🔄 Reset ho gaya, ' + hn + ' dobara apply kar sakta hai');
    } else if (a === 'paid') {
      const np = !verdicts[id].paid; await setPaid([id], np); toast(np ? '💸 Paid mark ho gaya' : 'Paid hata diya', false, () => setPaid([id], !np));
    } else {
      await writeVerdict(id, { status: a, amount: a === 'valid' ? amount : 0, paid: false });
      toast({ valid: '✅ Valid ₹' + amount + ' save ho gaya', duplicate: '🔁 Duplicate mark ho gaya', rejected: '❌ Reject ho gaya' }[a], false, () => writeVerdict(id, prevV));
    }
    render();
  } catch (err) { toast('Nahi hua: ' + errMsg(err), true); }
  finally { b.classList.remove('busy'); if (b.isConnected) b.textContent = label; }
});

document.addEventListener('click', async e => {
  const f = e.target.closest('[data-f]'); if (f) { rf = f.dataset.f; renderBar(); renderList(); return; }
  const cp = e.target.closest('[data-cp]'); if (cp) { try { await navigator.clipboard.writeText(cp.dataset.cp); toast('Copy ho gaya: ' + cp.dataset.cp); } catch { toast('Copy nahi hua', true); } }
});

/* ---------- export ---------- */
$('eTxt').onclick = async () => {
  const owner = byUid();
  const t = repList().map(r => {
    const v = verdicts[r.id] || {}, h = owner[r.hunterId] || {}, c = r.claim || {};
    return `QB-${r.id.slice(-6).toUpperCase()} | ${r.type} | ${v.status || 'pending'} | ₹${v.amount || 0}${v.paid ? ' (paid)' : ''}\n${h.name || '?'} | WA ${h.whatsapp || ''} | UPI ${h.upi || ''}\nClaim: ${c.surah ? c.surah + ':' + c.ayat + ', ' : ''}para ${c.para}, pip ${c.pip}\n${r.fingerprint}\n`;
  }).join('\n');
  try { await navigator.clipboard.writeText(t); $('eMsg').textContent = 'Copy ho gaya.'; } catch { $('eMsg').textContent = 'Copy nahi hua, JSON download use karein.'; }
};
$('eJson').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ hunters, status, reports, verdicts }, null, 2)], { type: 'application/json' }));
  a.download = 'bounty-export.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
</script>
